<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>رصد | Rasd</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">

<header>
  <div class="brand">
    <svg width="40" height="44" viewBox="0 0 40 44" fill="none"><path d="M20 2 36 8v14c0 10-7 17-16 20C11 39 4 32 4 22V8z" stroke="#20D9A5" stroke-width="2.4" stroke-linejoin="round"/><path d="M12.5 21a10 10 0 0 1 15 0" stroke="#35a8ff" stroke-width="2.6" stroke-linecap="round"/><circle cx="20" cy="24" r="3" fill="#20D9A5"/></svg>
    <span data-i="brand"></span>
  </div>
  <button class="lang" id="lang">English</button>
</header>

<section class="hero">
  <div class="radar-box">
    <svg class="radar" viewBox="0 0 400 400" fill="none">
      <defs>
        <radialGradient id="sw" cx="200" cy="200" r="195" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#20D9A5" stop-opacity=".05"/><stop offset="1" stop-color="#20D9A5" stop-opacity=".3"/></radialGradient>
        <radialGradient id="cg"><stop offset="0" stop-color="#20D9A5" stop-opacity=".22"/><stop offset="1" stop-color="#20D9A5" stop-opacity="0"/></radialGradient>
      </defs>
      <circle cx="200" cy="200" r="195" stroke="#2A3B58" stroke-width="1.5"/>
      <circle cx="200" cy="200" r="140" stroke="#2A3B58" stroke-width="1.5"/>
      <circle cx="200" cy="200" r="85" stroke="#2A3B58" stroke-width="1.5"/>
      <path d="M200 5V395M5 200H395" stroke="#2A3B58" stroke-width="1.2" stroke-dasharray="5 6"/>
      <g class="sweep"><path d="M200 200 200 5A195 195 0 0 0 16.8 133.3Z" fill="url(#sw)"/></g>
      <circle cx="200" cy="200" r="90" fill="url(#cg)"/>
      <g class="dot d1"><circle cx="283" cy="94" r="26" fill="#20D9A5" opacity=".12"/><circle cx="283" cy="94" r="7" fill="#20D9A5"/></g>
      <g class="dot d2"><circle cx="88" cy="287" r="18" fill="#20D9A5" opacity=".14"/><circle cx="88" cy="287" r="7" fill="#20D9A5"/></g>
      <g class="dot d3"><circle cx="287" cy="305" r="12" fill="#20D9A5" opacity=".16"/><circle cx="287" cy="305" r="7" fill="#20D9A5"/></g>
      <g transform="translate(164 158)"><path d="M36 2 66 14v24c0 18-13 31-30 36C19 69 6 56 6 38V14z" fill="#0a1426" stroke="#20D9A5" stroke-width="4" stroke-linejoin="round"/><path d="M20 42a22 22 0 0 1 32 0" stroke="#35a8ff" stroke-width="4.5" stroke-linecap="round"/><circle cx="36" cy="48" r="5" fill="#20D9A5"/></g>
    </svg>
  </div>

  <div class="hero-text">
    <div class="badge"><i></i><span data-i="badge"></span></div>
    <h1 data-i="title"></h1>
    <p data-i="sub"></p>

    <div class="box">
      <input id="url" type="text" inputmode="url" autocomplete="off" spellcheck="false" placeholder="https://example.com/login">
      <button class="btn" id="go" data-i="check"></button>
    </div>
    <label class="chk"><input type="checkbox" id="deep"><span data-i="deepL"></span></label>
    <div class="hint" data-i="hint"></div>
  </div>
</section>

<section class="card hidden" id="res">
  <div class="top">
    <div class="gauge">
      <svg viewBox="0 0 120 120"><circle cx="60" cy="60" r="52" fill="none" stroke="#2A3B58" stroke-width="9"/><circle id="arc" cx="60" cy="60" r="52" fill="none" stroke="#20D9A5" stroke-width="9" stroke-linecap="round" stroke-dasharray="327" stroke-dashoffset="327" transform="rotate(-90 60 60)"/></svg>
      <b id="sc">0</b>
    </div>
    <div><div class="verdict" id="vd"></div><div class="mut" id="vs"></div></div>
  </div>
  <h3 data-i="why"></h3><ul class="rs" id="rs"></ul>
  <h3 data-i="details"></h3><div class="det" id="det"></div>
  <p class="mut small" data-i="note"></p>
</section>

<section class="card reveal msgbox" id="msg">
  <h3 data-i="msgT"></h3>
  <p class="mut" data-i="msgSub"></p>
  <textarea id="msgIn" dir="auto" rows="5"></textarea>
  <button class="btn" id="msgGo" data-i="msgBtn"></button>
  <div class="res3" id="msgRes"></div>
</section>

<section class="card reveal" id="quiz">
  <h3 data-i="quizT"></h3>
  <p class="mut" data-i="quizSub"></p>
  <div id="quizBox"></div>
</section>

<section class="card reveal" id="leak">
  <h3 data-i="leakT"></h3>
  <p class="mut" data-i="leakSub"></p>
  <div class="two">
    <div>
      <label for="em" data-i="emL"></label>
      <div class="box mini"><input id="em" type="email" dir="ltr" autocomplete="off" placeholder="name@example.com"><button class="btn" id="emGo" data-i="check"></button></div>
      <div class="res2" id="emRes"></div>
    </div>
    <div>
      <label for="pw" data-i="pwL"></label>
      <div class="box mini"><input id="pw" type="password" dir="ltr" autocomplete="off"><button class="btn" id="pwGo" data-i="check"></button></div>
      <div class="hint" data-i="pwHint"></div>
      <div class="res2" id="pwRes"></div>
    </div>
  </div>
  <p class="mut small" data-i="leakNote"></p>
</section>

<section class="card reveal">
  <h3 data-i="repT"></h3>
  <div class="f">
    <input id="rl" type="text" placeholder="https://..." autocomplete="off">
    <select id="rt"></select>
    <textarea id="rn" rows="3"></textarea>
    <button class="btn" id="rb" data-i="send"></button>
    <div class="okmsg hidden" id="rok"></div>
  </div>
</section>

<section class="card reveal">
  <h3 data-i="tipT"></h3>
  <div class="tips" id="tips"></div>
</section>

<footer>© 2026 رصد · Rasd</footer>
</div>
<script src="config.js"></script>
<script src="script.js"></script>
</body>
</html>
